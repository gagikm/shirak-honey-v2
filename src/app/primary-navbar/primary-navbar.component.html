<!-- Top Bar -->
<div class="top-bar text-center py-2 text-white font-weight-bold" style="background-color: #A01F26;">
  Free local delivery in Sacramento area
</div>

<nav class="navbar navbar-expand-md navbar-light bg-white py-3 shadow-sm sticky-top">
  <div class="container">

    <!-- Mobile Toggler (Left on Mobile) -->
    <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Logo (Center on Mobile, Left on Desktop) -->
    <div class="navbar-brand-wrapper d-flex justify-content-center justify-content-md-start flex-grow-1 flex-md-grow-0">
      <a class="navbar-brand" routerLink="/" queryParamsHandling="merge">
        <img alt="Shirak Honey" src="../assets/img/logo.png" style="max-height: 50px;" />
      </a>
    </div>

    <!-- Mobile Cart Icon (Right on Mobile) -->
    <div class="d-md-none">
      <a class="nav-link text-dark" (click)="toggleCart($event)" style="cursor: pointer;">
        <i class="fa fa-shopping-bag"></i>
        <!-- Fallback if FA is not loaded, maybe an SVG or text -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="feather feather-shopping-bag">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </a>
    </div>

    <!-- Collapsible Content -->
    <div class="collapse navbar-collapse" [ngbCollapse]="isCollapsed" id="navbarContent">



      <!-- Center: Navigation Links -->
      <ul class="navbar-nav mr-auto text-uppercase font-weight-bold" (click)="toggleMenuIfMobile()">
        <li class="nav-item px-3" routerLinkActive="active">
          <a class="nav-link text-dark" routerLink="/shop-local-sacramento-honey" queryParamsHandling="merge">HONEY</a>
        </li>
        <li class="nav-item px-3" routerLinkActive="active">
          <a class="nav-link text-dark" routerLink="/sacramento-locations" queryParamsHandling="merge">STORES</a>
        </li>
        <li class="nav-item px-3" routerLinkActive="active">
          <a class="nav-link text-dark" routerLink="/about-shirak-honey-sacramento" queryParamsHandling="merge">HISTORY
          </a>
        </li>
        <li class="nav-item px-3" routerLinkActive="active">
          <a class="nav-link text-dark" routerLink="/contact-us-sacramento" queryParamsHandling="merge">SOCIAL</a>
        </li>
      </ul>

      <!-- Right: Search, Account, Cart -->
      <div class="d-flex align-items-center navbar-icons ml-auto">

        <!-- Cart -->
        <a class="nav-link text-dark d-none d-md-block" (click)="toggleCart($event)" style="cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-shopping-bag">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </a>
      </div>

    </div>
  </div>
</nav>
